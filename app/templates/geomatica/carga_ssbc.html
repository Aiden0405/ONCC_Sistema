{% extends 'base.html' %}

{% block title %}Mapas de Riesgo - ONCC{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto space-y-6 animate-in fade-in duration-500">
    <div class="p-6 rounded-xl shadow-sm border bg-white border-gray-100 dark:bg-gray-800 dark:border-gray-700 space-y-6">
        <form method="POST" action="{{ url_for('mapas.procesar_archivo') }}" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="tipo_mapa" value="riesgo">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="space-y-1">
                    <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400">Identificador / Nombre del Mapa</label>
                    <input type="text" name="nombre" placeholder="Ej: Mapa de Riesgo de Inundación - Barquisimeto" required maxlength="150" minlength="5"
                           class="w-full border rounded-md p-2 text-sm bg-white border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none" />
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400">Versión Cartográfica</label>
                    <input type="text" name="version" placeholder="Ej: v1.0" required maxlength="30"
                           class="w-full border rounded-md p-2 text-sm bg-white border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none" />
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400">Cobertura Territorial</label>
                    <input type="text" name="cobertura" placeholder="Ej: Municipio Jiménez, Lara" required maxlength="120"
                           class="w-full border rounded-md p-2 text-sm bg-white border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-red-500 focus:border-transparent outline-none" />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end pt-2">
                <div class="md:col-span-2 space-y-1">
                    <label class="block text-xs font-semibold uppercase text-gray-600 dark:text-gray-400">Archivo Data Cruda (SSBC / Excel / CSV)</label>
                    <input type="file" name="archivo_ssbc" accept=".xlsx, .xls, .ssbc, .csv" required
                           class="block w-full text-xs text-gray-500 dark:text-gray-400 border border-gray-300 dark:border-gray-600 rounded-md p-1.5 bg-white dark:bg-gray-700
                           file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-red-50 file:text-red-700 dark:file:bg-red-900/30 dark:file:text-red-400" />
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white rounded-md text-sm font-medium h-9 transition-colors shadow-sm flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="mr-2 w-4 h-4"></i> Procesar Capa de Riesgo
                </button>
            </div>
        </form>
    </div>

    <div class="rounded-xl shadow-sm border overflow-hidden bg-white border-gray-100 dark:bg-gray-800 dark:border-gray-700">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left border-collapse">
                <tbody class="divide-y divide-gray-100 dark:divide-gray-700 text-gray-700 dark:text-gray-300">
                    {% for carga in cargas %}
                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/30 transition-colors">
                        <td class="px-6 py-4 font-medium text-gray-800 dark:text-gray-100">{{ carga.nombre }}</td>
                        <td class="px-6 py-4 font-mono text-xs text-gray-600 dark:text-gray-400">{{ carga.version }}</td>
                        <td class="px-6 py-4 font-mono text-xs text-gray-500 dark:text-gray-400 max-w-xs truncate">{{ carga.archivo or 'N/D' }}</td>
                        <td class="px-6 py-4 text-gray-600 dark:text-gray-400">{{ carga.cobertura }}</td>
                        <td class="px-6 py-4 text-right flex justify-end gap-2 whitespace-nowrap">
                            <form method="POST" action="{{ url_for('mapas.cambiar_estado', mapa_id=carga.id) }}" class="inline-flex items-center gap-1.5 bg-gray-50 dark:bg-gray-900/60 p-1 rounded-md border border-gray-100 dark:border-gray-700">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <select name="estado" class="border rounded bg-white border-gray-300 dark:bg-gray-700 dark:border-gray-600 dark:text-white px-2 py-0.5 text-xs outline-none">
                                    {% for estado in estados_flujo %}
                                        <option value="{{ estado }}" {% if estado == carga.estado %}selected{% endif %}>{{ estado }}</option>
                                    {% endfor %}
                                </select>
                                <button class="text-[11px] font-semibold px-2 py-0.5 rounded bg-blue-600 text-white hover:bg-blue-700 transition-colors">Guardar</button>
                            </form>

                            <form method="POST" action="{{ url_for('mapas.eliminar_mapa', mapa_id=carga.id) }}" onsubmit="return confirm('¿Está seguro de eliminar el mapa {{ carga.nombre }}? Esta acción no se puede deshacer.');">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="text-[11px] font-semibold px-2 py-1.5 rounded bg-red-600 text-white hover:bg-red-700 transition-colors" title="Eliminar Registro">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
