{% extends 'base.html' %}

{% block title %}Permisos - ONCC{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h2 class="text-xl font-bold mb-4">Permisos</h2>
    <a href="{{ url_for('rol.permiso_nuevo') }}" class="bg-green-600 text-white px-3 py-1 rounded mb-4 inline-block">Nuevo Permiso</a>
    <div class="bg-white rounded shadow p-4">
        <table class="w-full">
            <thead>
                <tr><th>Nombre</th><th>Descripción</th></tr>
            </thead>
            <tbody>
                {% for p in permisos %}
                <tr class="border-t"><td>{{ p.nombre }}</td><td>{{ p.descripcion }}</td></tr>
                {% else %}
                <tr><td colspan="2">No hay permisos definidos.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
