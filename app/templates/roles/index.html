{% extends 'base.html' %}

{% block title %}Roles - ONCC{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Roles</h2>
        <a href="{{ url_for('rol.nuevo') }}" class="bg-green-600 text-white px-4 py-2 rounded">Nuevo Rol</a>
    </div>

    <div class="bg-white rounded shadow p-4">
        <table class="w-full text-sm">
            <thead>
                <tr class="text-left text-xs text-gray-500">
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for r in roles %}
                <tr class="border-t">
                    <td class="py-2">{{ r.nombre }}</td>
                    <td>{{ r.descripcion or '-' }}</td>
                    <td class="text-right">
                        <a href="{{ url_for('rol.editar', rol_id=r.id) }}" class="text-blue-600 mr-2">Editar</a>
                        <form action="{{ url_for('rol.eliminar', rol_id=r.id) }}" method="post" style="display:inline" onsubmit="return confirm('Eliminar rol?');">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button class="text-red-600">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="py-4 text-center text-gray-500">No hay roles definidos.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
